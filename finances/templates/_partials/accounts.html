{% load humanize %}
{% if records %}
<ul>
    {% for record in records %}
    <li>
        <div>{{ record.name }}</div>
        <div class="highlight">£{{ record.total|floatformat:2|intcomma }}</div>
    </li>
    {% endfor %}
    <li class="total">
        <div class="highlight">Total</div>
        <div class="highlight">£{{ total|floatformat:2|intcomma }}</div>
    </li>
</ul>
{% else %}
<p>No accounts have been setup</p>
{% endif %}
